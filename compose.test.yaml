# Optional existing frontend for local API acceptance. Not part of the API image.
services:
  test-ui:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${EXCEL_TEST_UI_PORT:-8092}:80"
    volumes:
      - ./examples/frontend:/usr/share/nginx/html/ui:ro
      - ./deploy/test-ui.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      excel-agent:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
