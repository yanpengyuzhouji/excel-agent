server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Leave room for multipart headers around a 200 MiB file.
    client_max_body_size 210m;

    location = / { return 302 /ui/; }
    location /ui/ { index index.html; }

    location /api/ {
        proxy_pass http://excel-agent:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;
    }
}
